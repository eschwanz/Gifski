<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="planeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7277"/>
      <stop offset="1" stop-color="#f54777"/>
    </linearGradient>
    <linearGradient id="planeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8b78"/>
      <stop offset="1" stop-color="#ff4c83"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fa7383"/>
      <stop offset=".5" stop-color="#ff6548"/>
      <stop offset="1" stop-color="#f12d52"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17202a" flood-opacity=".10"/>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1d2d3f" opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#fbf6e9"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity=".06"/>

  <!-- sun -->
  <circle cx="1515" cy="120" r="112" fill="#ffc20b"/>

  <!-- floating planes -->
  <polygon points="-60,82 605,195 365,320 -110,220" fill="url(#planeB)" opacity=".92" filter="url(#softShadow)"/>
  <polygon points="1160,220 1640,110 1700,310 1340,385" fill="url(#planeA)" opacity=".90" filter="url(#softShadow)"/>
  <polygon points="40,410 540,335 760,465 220,555" fill="url(#planeA)" opacity=".86" filter="url(#softShadow)"/>
  <polygon points="1170,485 1640,400 1680,565 1290,620" fill="url(#planeB)" opacity=".84" filter="url(#softShadow)"/>
  <polygon points="130,670 620,590 810,704 265,790" fill="url(#planeB)" opacity=".82" filter="url(#softShadow)"/>

  <!-- ladders -->
  <g stroke="#124fa0" stroke-width="11" fill="none">
    <line x1="238" y1="-40" x2="238" y2="360"/><line x1="300" y1="-40" x2="300" y2="360"/>
    <line x1="1380" y1="-45" x2="1380" y2="330"/><line x1="1437" y1="-45" x2="1437" y2="330"/>
    <line x1="378" y1="298" x2="378" y2="665"/><line x1="430" y1="298" x2="430" y2="665"/>
    <line x1="1330" y1="535" x2="1330" y2="945"/><line x1="1384" y1="535" x2="1384" y2="945"/>
  </g>
  <g stroke="#124fa0" stroke-width="8">
    <path d="M238 10h62 M238 48h62 M238 86h62 M238 124h62 M238 162h62 M238 200h62 M238 238h62 M238 276h62 M238 314h62"/>
    <path d="M1380 6h57 M1380 44h57 M1380 82h57 M1380 120h57 M1380 158h57 M1380 196h57 M1380 234h57 M1380 272h57"/>
    <path d="M378 330h52 M378 368h52 M378 406h52 M378 444h52 M378 482h52 M378 520h52 M378 558h52 M378 596h52 M378 634h52"/>
    <path d="M1330 570h54 M1330 610h54 M1330 650h54 M1330 690h54 M1330 730h54 M1330 770h54 M1330 810h54 M1330 850h54 M1330 890h54"/>
  </g>

  <!-- pyramids -->
  <g filter="url(#softShadow)">
    <polygon points="165,127 245,280 80,280" fill="#ffd0dc"/>
    <polygon points="165,127 165,280 80,280" fill="#f19bb1"/>
    <polygon points="325,210 371,300 278,300" fill="#ffd6df"/>
    <polygon points="325,210 325,300 278,300" fill="#f4a4b9"/>
  </g>

  <!-- clouds -->
  <g fill="#e91b26">
    <path d="M1180 128c20-44 85-53 116-13 43-18 89 14 90 56 30 3 52 28 52 57H1162c-22-34-4-80 18-100z"/>
    <path d="M74 743c16-39 70-48 101-19 38-15 78 10 83 48 31 3 54 29 54 60H40c-17-38 3-74 34-89z"/>
  </g>

  <!-- blue/red arch -->
  <path d="M145 555v-122c0-50 85-50 85 0v122" fill="none" stroke="#1266cc" stroke-width="48"/>
  <path d="M187 433c22 0 43 17 43 43" fill="none" stroke="#ef2d32" stroke-width="48"/>

  <!-- orbit curves -->
  <path d="M350 92 C690 -52 855 95 670 184" fill="none" stroke="#f1a20e" stroke-width="3"/>
  <path d="M900 286 C1110 144 1290 124 1420 132" fill="none" stroke="#ff4f58" stroke-width="3"/>
  <path d="M660 505 C920 665 1155 632 1288 520" fill="none" stroke="#f05f47" stroke-width="3"/>
  <path d="M962 535 C1088 642 1280 640 1466 484" fill="none" stroke="#1676d2" stroke-width="3"/>

  <!-- large ribbon -->
  <path d="M-80 610 C330 485 650 675 945 690 C1190 703 1370 626 1665 476" fill="none" stroke="url(#ribbon)" stroke-width="58" stroke-linecap="round" opacity=".93"/>
  <path d="M1000 746 C1170 825 1320 737 1490 555" fill="none" stroke="#ffd21a" stroke-width="36" stroke-linecap="round"/>
  <path d="M1490 555 C1540 505 1590 470 1640 448" fill="none" stroke="#f01f24" stroke-width="25" stroke-linecap="round"/>

  <!-- colorful bars / accents -->
  <g>
    <rect x="405" y="56" width="152" height="24" rx="8" fill="#ffb20e" transform="rotate(-28 405 56)"/>
    <rect x="835" y="665" width="165" height="28" rx="12" fill="#ffc51a" transform="rotate(-43 835 665)"/>
    <ellipse cx="1122" cy="318" rx="52" ry="18" fill="#0db5be" transform="rotate(45 1122 318)"/>
    <polygon points="994,185 1065,225 995,270" fill="#ef3436"/>
    <polygon points="52,410 180,355 110,432" fill="#f5222d"/>
  </g>

  <!-- decorative dots -->
  <g>
    <circle cx="105" cy="75" r="12" fill="#12a5b8"/>
    <circle cx="535" cy="74" r="17" fill="#ff641a"/>
    <circle cx="552" cy="245" r="32" fill="#2b94ca"/>
    <circle cx="500" cy="344" r="12" fill="#ffc21c"/>
    <circle cx="686" cy="315" r="8" fill="#105dcc"/>
    <circle cx="1260" cy="345" r="20" fill="#ffc51a"/>
    <circle cx="1130" cy="547" r="16" fill="#ff5e1d"/>
    <circle cx="760" cy="615" r="14" fill="#ed3534"/>
    <circle cx="1170" cy="690" r="10" fill="#0965d8"/>
    <circle cx="1492" cy="690" r="12" fill="#e93c49"/>
    <circle cx="150" cy="363" r="11" fill="#ff5d1e"/>
    <circle cx="350" cy="470" r="10" fill="#125dcc"/>
  </g>

  <!-- small dot constellations -->
  <g fill="#1b2a39" opacity=".9">
    <circle cx="420" cy="135" r="2"/><circle cx="438" cy="142" r="2"/><circle cx="456" cy="135" r="2"/><circle cx="474" cy="142" r="2"/><circle cx="492" cy="135" r="2"/>
    <circle cx="405" cy="500" r="2"/><circle cx="425" cy="510" r="2"/><circle cx="445" cy="500" r="2"/><circle cx="465" cy="510" r="2"/><circle cx="485" cy="500" r="2"/>
    <circle cx="1015" cy="705" r="2"/><circle cx="1035" cy="714" r="2"/><circle cx="1055" cy="705" r="2"/><circle cx="1075" cy="714" r="2"/><circle cx="1095" cy="705" r="2"/>
  </g>

  <!-- title -->
  <g filter="url(#softShadow)">
    <text x="800" y="445" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
          font-size="104" font-weight="750" letter-spacing="-4" fill="#17202a">Gif’in Stills</text>
  </g>
</svg>