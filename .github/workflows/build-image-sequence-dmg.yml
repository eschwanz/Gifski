name: Build Gif'in Stills DMG

concurrency:
  group: gif-in-stills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - feature/image-sequences
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          rustc --version || true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Migrate splash artwork to asset catalog
        id: splash
        shell: bash
        run: |
          set -euo pipefail
          SPLASH="Gifski/Assets.xcassets/GifInStillsSplash.imageset/GifInStillsSplash.jpg"

          if compgen -G "Gifski/Components/SplashImagePart*.swift" > /dev/null; then
            python3 <<'PY'
          import base64
          import glob
          import pathlib
          import re

          parts = []
          for file in sorted(glob.glob("Gifski/Components/SplashImagePart*.swift")):
              text = pathlib.Path(file).read_text()
              match = re.search(r'#"""\s*(.*?)\s*"""#', text, re.S)
              if not match:
                  raise RuntimeError(f"Could not read embedded splash chunk: {file}")
              parts.append(re.sub(r"\s+", "", match.group(1)))

          data = base64.b64decode("".join(parts), validate=True)
          path = pathlib.Path("Gifski/Assets.xcassets/GifInStillsSplash.imageset/GifInStillsSplash.jpg")
          path.write_bytes(data)
          print(f"Wrote {len(data):,} bytes to {path}")
          PY

            git rm -f Gifski/Components/SplashImageData.swift Gifski/Components/SplashImagePart*.swift
            git add "$SPLASH"
            echo "migrated=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrated=false" >> "$GITHUB_OUTPUT"
          fi

          WIDTH="$(sips -g pixelWidth "$SPLASH" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$SPLASH" | awk '/pixelHeight/ {print $2}')"
          echo "Splash dimensions: ${WIDTH}x${HEIGHT}"
          test "$WIDTH" -ge 1600
          test "$HEIGHT" -ge 900

      - name: Commit migrated splash asset
        if: steps.splash.outputs.migrated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate splash artwork to asset catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Gifski.xcodeproj -scheme Gifski

      - name: Test image sequence exports
        run: |
          set -o pipefail
          xcodebuild \
            -project Gifski.xcodeproj \
            -scheme Gifski \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -only-testing:GifskiTests/ImageSequenceTests \
            test | tee "$RUNNER_TEMP/xcodebuild-tests.log"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project Gifski.xcodeproj \
            -scheme Gifski \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Locate app
        id: app
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release" -maxdepth 1 -name 'Gifski.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - "${{ steps.app.outputs.path }}"

      - name: Package DMG
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "${{ steps.app.outputs.path }}" "$RUNNER_TEMP/dmg/Gif'in Stills.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create \
            -volname "Gif'in Stills" \
            -srcfolder "$RUNNER_TEMP/dmg" \
            -ov \
            -format UDZO \
            "$RUNNER_TEMP/GifIn-Stills.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: GifIn-Stills-DMG
          path: ${{ runner.temp }}/GifIn-Stills.dmg
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodebuild-tests.log
          if-no-files-found: ignore
